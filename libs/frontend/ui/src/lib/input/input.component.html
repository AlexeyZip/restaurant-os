<mat-form-field appearance="outline" class="full-width">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
  @if (hint() && !showError()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
</mat-form-field>
<!--
  Deliberately outside <mat-form-field>: MatFormField only ever projects ONE
  of its <mat-error>/<mat-hint> content children, picked by its own
  `_control.errorState` (see _getDisplayedMessages() in Material's source).
  `_control` is the MatInput directive on the native <input> above, and since
  our real formControlName lives on <ui-input> (the wrapper), not on that
  native <input>, MatInput never sees a NgControl and its errorState is
  permanently false - so a <mat-error> inside <mat-form-field> would never
  actually be inserted into the DOM, no matter what our own showError()
  says. Rendering our own element here sidesteps that internal switch
  entirely and stays under our full control.
-->
@if (showError()) {
  <p class="ui-input-error">{{ errorMessage() }}</p>
}
