<mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
  @if (hint() && !showError()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
</mat-form-field>
<!--
  Deliberately outside <mat-form-field>: it only projects <mat-error> when
  its internal MatInput directive has its own NgControl with errorState=true.
  Our formControlName lives on <ui-input> (the wrapper), not the native
  <input>, so that never happens - a real <mat-error> here would silently
  never render. Rendering our own element sidesteps that entirely.
-->
@if (showError()) {
  <p class="ui-input-error">{{ errorMessage() }}</p>
}
